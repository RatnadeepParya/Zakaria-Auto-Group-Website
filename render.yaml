# Render Blueprint Specification
# Zakaria Auto Group LLC — Enterprise Dealership Web Platform
# https://render.com/docs/blueprint-spec

databases:
  - name: zakaria-db
    databaseName: zakaria_auto_group
    user: zakaria_admin
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------
  # 1. Zakaria Auto Group REST API (Express 4.21 + Prisma ORM)
  # -------------------------------------------------------------
  - type: web
    name: zakaria-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run render:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zakaria-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: FIELD_ENCRYPTION_KEY
        value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: zakaria-web
          property: host

  # -------------------------------------------------------------
  # 2. Zakaria Auto Group Web Client (Next.js 15 App Router)
  # -------------------------------------------------------------
  - type: web
    name: zakaria-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          type: web
          name: zakaria-api
          property: host
